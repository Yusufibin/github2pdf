name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - name: Install and exercise the wheel outside the source tree
        shell: bash
        run: |
          python -m venv /tmp/github2pdf-wheel
          /tmp/github2pdf-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/github2pdf-wheel/bin/github2pdf --version
          /tmp/github2pdf-wheel/bin/github2pdf "$GITHUB_WORKSPACE/examples/demo" -o /tmp/demo.pdf
          /tmp/github2pdf-wheel/bin/python -c "from pathlib import Path; assert Path('/tmp/demo.pdf').read_bytes().startswith(b'%PDF-')"
