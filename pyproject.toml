[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "github2pdf"
version = "0.2.0"
description = "Turn a GitHub repository or local project into a readable, navigable source-code PDF."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Yusufibin" }]
keywords = ["github", "pdf", "source-code", "documentation", "cli"]
dependencies = ["requests>=2.32,<3", "reportlab>=4.2,<5", "Pygments>=2.18,<3"]

[project.urls]
Repository = "https://github.com/Yusufibin/github2pdf"
Issues = "https://github.com/Yusufibin/github2pdf/issues"

[project.scripts]
github2pdf = "github2pdf.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf>=5,<7", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["github2pdf"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
